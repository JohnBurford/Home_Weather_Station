<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34 Norval Weather Station</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
    <style>
        #chart-container {
            width: 90%;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>
        Stoneham MA Weather 
        <span style="font-size: 0.5em; color: gray;" id="last-time">Last Updated: --</span>
    </h1>
    <p style="font-size: 1.5em;">
        <strong style="color: rgba(255, 99, 132, 1);">Temperature:</strong> 
        <span id="current-temp">-- °F</span> /
        <strong style="color: rgba(54, 162, 235, 1);">Humidity:</strong> 
        <span id="current-humidity">--%</span> /
        <strong style="color: rgba(75, 192, 192, 1);">Pressure:</strong> 
        <span id="current-pressure">-- hPa</span>
    </p>
    <h2>Last 3 Days</h2>
    <div id="chart-container">
        <canvas id="weatherChart"></canvas>
    </div>

    <script>
        let weatherChart; 

        function fetchData() {
            console.log('Fetching new data...');
            fetch('/api/data') // Replace with your server's endpoint
                .then(response => response.json())
                .then(data => {
                    console.log('Data received:', data);

                    if (!data || !data.length) {
                        console.error('No valid data received.');
                        return;
                    }

                    // Extract data
                    const times = data.map(item => item.timestamp);
                    const temperatures = data.map(item => item.temperature);
                    const humidities = data.map(item => item.humidity);
                    const pressures = data.map(item => item.pressure);

                    // Update current readings
                    const lastTime = new Date(times[times.length - 1]);
                    document.getElementById('current-temp').textContent = `${temperatures[temperatures.length - 1].toFixed(2)} °F`;
                    document.getElementById('current-humidity').textContent = `${humidities[humidities.length - 1].toFixed(2)}%`;
                    document.getElementById('current-pressure').textContent = `${pressures[pressures.length - 1].toFixed(2)} hPa`;
                    document.getElementById('last-time').textContent = lastTime.toLocaleString();

                    // Update chart
                    weatherChart.data.labels = times;
                    weatherChart.data.datasets[0].data = temperatures;
                    weatherChart.data.datasets[1].data = humidities;
                    weatherChart.data.datasets[2].data = pressures;
                    weatherChart.update();
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('weatherChart').getContext('2d');

            weatherChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [], // Timestamps
                    datasets: [
                        {
                            label: 'Temperature (°F)',
                            data: [],
                            borderColor: 'rgba(255, 99, 132, 1)',
                            fill: false,
                            yAxisID: 'y1'
                        },
                        {
                            label: 'Humidity (%)',
                            data: [],
                            borderColor: 'rgba(54, 162, 235, 1)',
                            fill: false,
                            yAxisID: 'y1'
                        },
                        {
                            label: 'Pressure (hPa)',
                            data: [],
                            borderColor: 'rgba(75, 192, 192, 1)',
                            fill: false,
                            yAxisID: 'y2'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'hour', // Automatically show hours and add date at midnight
                                tooltipFormat: 'MMM D, h:mm A', // Tooltip format
                                displayFormats: {
                                    hour: 'MMM D, h:mm A', // Include date at midnight
                                    day: 'MMM D'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Time'
                            },
                            ticks: {
                                autoSkip: true,
                                maxTicksLimit: 10,
                                callback: (value, index, values) => {
                                    const currentLabel = values[index].value;
                                    const previousLabel = index > 0 ? values[index - 1].value : null;

                                    // Show full date if it's the start of a new day
                                    if (previousLabel) {
                                        const currentDate = new Date(currentLabel);
                                        const previousDate = new Date(previousLabel);

                                        if (currentDate.getDate() !== previousDate.getDate()) {
                                            return moment(currentLabel).format('MMM D');
                                        }
                                    }

                                    return moment(currentLabel).format('h:mm A');
                                }
                            }
                        },
                        y1: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Temperature / Humidity'
                            }
                        },
                        y2: {
                            type: 'linear',
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Pressure'
                            }
                        }
                    }
                }
            });

            // Initial data fetch and set interval for updates
            fetchData();
            setInterval(fetchData, 120000);
        });
    </script>
</body>
</html>
